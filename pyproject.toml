[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl"
version = "0.1.0"
description = "Local, reproducible machine learning experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
mlflow = ["mlflow>=2"]

[project.scripts]
automl = "automl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["automl*", "examples*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
