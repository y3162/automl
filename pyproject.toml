[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl"
version = "0.1.0"
description = "Local, reproducible machine learning experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "numpy>=1.26,<3", "duckdb>=1.4,<3", "soundfile>=0.13,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
mlflow = ["mlflow>=2"]
speech-v0 = [
    "torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0", "nnAudio==0.3.3",
    "nemo_toolkit[asr]==3.0.0", "numba==0.61.0", "cuda-bindings>=12.8,<13",
    "nvidia-cuda-nvcc-cu12==12.2.140; sys_platform == 'linux'",
    "transformers>=4.48,<5", "numpy>=1.26,<2.2", "librosa>=0.10.1,<1.1",
]

[project.scripts]
automl = "automl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["automl*", "corpora*", "examples*", "methods*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"methods.asr_guided_se.v1" = ["NOTICE"]
"methods.asr_guided_se.v1.wer_normalization" = ["LICENSE"]
